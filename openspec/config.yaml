schema: spec-driven
githubCopilot:
  cloudAgent: false

# Project context (optional)
# Add only constraints that should guide OpenSpec artifacts and workflows.
# Include constraints an agent cannot infer by reading the code.
# Keep general project documentation and discoverable codebase facts out.
# Example:
#   context: |
#     Designs and tasks must cover Windows, macOS, and Linux
#     Write all artifacts in Spanish

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing

context: |
  Hackathon project "Lineup Oracle" (Microsoft x Premier League "Inside the Game"); see PLAN.md.
  Backend Python (FastAPI, SciPy MILP, Microsoft Agent Framework only; no LangGraph/AutoGen).
  UI is ASP.NET Razor Pages + HTMX. Azure Container Apps, Postgres, Foundry gpt-4.1-mini (model name from env var).
  All data is synthetic (rule 4.7): invented club/player names, no crests/logos/photos; the real-to-synthetic
  mapping is private and never committed. Deterministic code picks the XI; the LLM only parses and explains,
  and the API must still return an XI if the LLM fails. Solo build, about 8 days: keep changes small.

rules:
  proposal:
    - Read ARCHITECTURE.md first and state which contracts or components the change touches.
  design:
    - Read ARCHITECTURE.md first and keep the design consistent with it; flag any needed change to it.
  tasks:
    - Include unit tests for the change's new logic as explicit tasks, and a final task that runs the full test suite.
    - If the change alters a contract or component, include a task to update ARCHITECTURE.md in the same PR.
    - First task creates the feature branch feature/<change-name>.
    - Last task is a human approval gate (HITL): stop and wait for the user to approve. After approval, run the OpenSpec archive, then open a PR and merge it.

operations:
  apply:
    guidance:
      - Work on the feature branch feature/<change-name>, never on main. The PR goes from that branch to main.
      - Write the unit tests with the code; do not mark the change done until they pass.
      - After implementation and tests pass, summarize results and stop for human approval. Do not merge to main or archive without it. Once approved, run the OpenSpec archive, then create a PR and merge it.
  archive:
    guidance:
      - Archive once the user has approved the change, never before. After archiving, create a PR from the feature branch and merge it.

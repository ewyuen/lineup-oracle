[project]
name = "lineup-oracle"
version = "0.1.0"
description = "Synthetic data and replay for Lineup Oracle"
requires-python = ">=3.12"
dependencies = ["scipy>=1.11", "fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27", "agent-framework-core>=1.22,<2", "agent-framework-openai>=1.17,<2", "azure-identity>=1.15", "azure-monitor-opentelemetry>=1.6", "python-dotenv>=1.0", "psycopg[binary]>=3.2"]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[tool.setuptools]
packages = ["lineup_oracle"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
